/canvas><main><div><h1>Website under construction</h1><p>A new perspective is taking shape.</p><p class="hint" id="hint">Move your cursor to reveal the colour.</p></div></main><footer>© <span id="year"></span> AQYR STUDIOS</footer><script>
const REVEAL_RADIUS=60, MOBILE_RADIUS=48, TRAIL_DURATION=950, BACKGROUND='#aea898';
